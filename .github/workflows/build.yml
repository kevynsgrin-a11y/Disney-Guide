name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies by design — test, validate, build, then audit the rendered output.
      - name: Unit tests
        run: npm test

      - name: Validate data
        run: npm run validate

      - name: Fact check against the reference tables
        run: npm run factcheck

      - name: Build site
        run: npm run build:fast

      - name: Audit rendered site
        run: npm run audit:site

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

      # Site 2 runs the same shape of gate against its own data. It is a separate job step rather
      # than a separate workflow because its validator resolves every cross-link against Site 1's
      # live URL set — the two builds are only meaningfully green together.
      - name: Validate seasonal data
        run: npm run validate:seasonal

      - name: Fact check seasonal data
        run: npm run factcheck:seasonal

      - name: Build seasonal site
        run: npm run build:seasonal:fast

      - name: Audit rendered seasonal site
        run: npm run audit:seasonal

      - name: Upload seasonal build
        uses: actions/upload-artifact@v4
        with:
          name: dist-seasonal
          path: dist-seasonal
          retention-days: 7
