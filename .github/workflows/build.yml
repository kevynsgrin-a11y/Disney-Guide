name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies by design — test, validate, build, then audit the rendered output.
      # Every step runs across every operator in data/operators.json.
      - name: Unit tests
        run: npm test

      # Two data contracts, two validators, two fact checkers — one site.
      - name: Validate data
        run: npm run validate

      - name: Fact check against the reference tables
        run: npm run factcheck

      # The audio scripts are generated from the month data and committed, so a data change that
      # was not followed by a regeneration shows up here as a diff. Audio is the one format where a
      # stale claim reaches a listener with nothing on screen to contradict it, so the drift has to
      # fail a build rather than wait for someone to notice.
      - name: Audio scripts are in sync with the data they narrate
        run: |
          node scripts/audio-script.mjs disney
          git diff --exit-code -- build/audio-scripts \
            || (echo "::error::Audio scripts are stale. Run: node scripts/audio-script.mjs disney" && exit 1)

      - name: Build site
        run: npm run build:fast

      - name: Audit rendered site
        run: npm run audit:site

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
