name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies by design — test, validate, build, then audit the rendered output.
      # Every step runs across every operator in data/operators.json.
      - name: Unit tests
        run: npm test

      # Two data contracts, two validators, two fact checkers — one site.
      - name: Validate data
        run: npm run validate

      - name: Fact check against the reference tables
        run: npm run factcheck

      - name: Build site
        run: npm run build:fast

      - name: Audit rendered site
        run: npm run audit:site

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
