name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies by design — validate, build, then audit the rendered output.
      - name: Validate data
        run: npm run validate

      - name: Build site
        run: npm run build:fast

      - name: Audit rendered site
        run: npm run audit:site

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
